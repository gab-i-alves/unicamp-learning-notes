<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Anotações de Estudo">
  <title>Anotações de Estudo</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3cc4"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="32" fill="url(#fundo)"/>
  <!-- cilindro de banco de dados em três discos -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <ellipse cx="72" cy="46" rx="34" ry="11"/>
    <path d="M38 46 v52 a34 11 0 0 0 68 0 v-52"/>
    <path d="M38 64 a34 11 0 0 0 68 0"/>
    <path d="M38 82 a34 11 0 0 0 68 0"/>
  </g>
  <!-- lápis anotando -->
  <g transform="translate(108 70) rotate(40)">
    <rect x="-7" y="0" width="14" height="52" rx="2" fill="#ffd166"/>
    <rect x="-7" y="0" width="14" height="9" rx="2" fill="#c9b8ff"/>
    <path d="M-7 52 L0 66 L7 52 Z" fill="#fde7c2"/>
    <path d="M-2.5 61 L0 66 L2.5 61 Z" fill="#2b2250"/>
  </g>
</svg>
